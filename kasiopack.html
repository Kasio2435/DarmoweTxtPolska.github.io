<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasiopack – Galeria</title>
  <style>
    :root {
      --bg: #000;
      --text: #fff;
      --tile-bg: #fff;
      --tile-text: #000;
    }

    html, body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
    }

    .container {
      max-width: 920px;
      margin: 20px auto 60px;
      padding: 0 16px;
      box-sizing: border-box;
      text-align: center;
    }

    h1 {
      margin: 12px 0 26px;
      font-size: clamp(20px, 4vw, 36px);
      font-weight: 700;
    }

    /* GALERIA PIONOWA */
    .gallery {
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
    }

    .gallery figure {
      width: 100%;
      max-width: 880px;
      margin: 0;
    }

    .gallery img {
      width: 100%;
      border-radius: 10px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.6);
      object-fit: cover;
      display: block;
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .gallery img:hover {
      transform: translateY(-6px);
      box-shadow: 0 14px 40px rgba(0,0,0,0.75);
    }

    /* Kafelek na dole, wyśrodkowany */
    .bottom-tile {
      display: block;
      margin: 48px auto 24px;
      padding: 14px 26px;
      background: var(--tile-bg);
      color: var(--tile-text);
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      font-size: 18px;
      max-width: 360px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0,0,0,0.5);
      transition: transform .12s ease;
    }

    .bottom-tile:hover {
      transform: translateY(-4px);
    }

    @media (max-width: 600px) {
      .container { padding: 0 12px; }
      .bottom-tile { max-width: 100%; }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Kasiopack – Galeria</h1>

    <section class="gallery" aria-label="Galeria zdjęć">
      <!-- 5 zdjęć w folderze imagesimages -->
      <figure><img src="imagesimages/zdjecie1.png" alt="Zdjęcie 1" loading="lazy"></figure>
      <figure><img src="imagesimages/zdjecie2.png" alt="Zdjęcie 2" loading="lazy"></figure>
      <figure><img src="imagesimages/zdjecie3.png" alt="Zdjęcie 3" loading="lazy"></figure>
      <figure><img src="imagesimages/zdjecie4.png" alt="Zdjęcie 4" loading="lazy"></figure>
      <figure><img src="imagesimages/zdjecie5.png" alt="Zdjęcie 5" loading="lazy"></figure>
    </section>

    <a class="bottom-tile" href="https://example.com" target="_blank" rel="noopener">
      Kafelek z linkiem
    </a>
  </main>
</body>
</html>
