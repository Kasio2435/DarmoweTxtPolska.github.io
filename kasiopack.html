<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Kasiopack – Galeria</title>
  <style>
    :root{
      --bg: #000;
      --text: #fff;
      --card-bg: #111;
      --tile-bg: #fff;
      --tile-text: #000;
    }

    html,body{
      height:100%;
      margin:0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
      -webkit-font-smoothing:antialiased;
      -moz-osx-font-smoothing:grayscale;
    }

    .container{
      max-width: 900px;
      margin: 24px auto;
      padding: 0 16px 48px;
      box-sizing: border-box;
    }

    h1{
      text-align:center;
      margin: 10px 0 26px;
      font-size: clamp(20px,4vw,36px);
      font-weight:700;
    }

    /* GALERIA PIONOWA */
    .gallery{
      display: flex;
      flex-direction: column;
      gap: 18px;
      align-items: center; /* centrowanie zdjęć */
    }

    .gallery img{
      width: 100%;
      max-width: 820px; /* maksymalna szerokość obrazka */
      height: auto;
      border-radius: 10px;
      object-fit: cover;
      box-shadow: 0 6px 18px rgba(0,0,0,0.6);
      transition: transform .18s ease, box-shadow .18s ease;
      cursor: pointer;
      display: block;
    }

    .gallery img:hover{
      transform: translateY(-6px) scale(1.01);
      box-shadow: 0 10px 30px rgba(0,0,0,0.7);
    }

    /* opis pod zdjeciem (opcjonalnie) */
    .caption{
      width: 100%;
      max-width: 820px;
      color: rgba(255,255,255,0.7);
      font-size: 14px;
      margin-top: 8px;
      text-align: left;
    }

    /* kafelek na dole (po galerii) */
    .bottom-tile{
      margin: 48px auto 24px;
      display: inline-block;
      background: var(--tile-bg);
      color: var(--tile-text);
      padding: 16px 26px;
      border-radius: 12px;
      text-decoration: none;
      font-weight: 700;
      font-size: 16px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.4);
      transition: transform .12s ease;
    }
    .bottom-tile:hover{ transform: translateY(-4px); }

    /* responsywność */
    @media (max-width:600px){
      .container{ padding: 0 12px 32px; }
      .gallery img{ max-width: 100%; border-radius: 8px; }
    }
  </style>
</head>
<body>
  <main class="container">
    <h1>Kasiopack – Galeria</h1>

    <section class="gallery" aria-label="Galeria zdjęć">
      <!-- Dodaj tu swoje zdjęcia w folderze /images/ -->
      <figure>
        <img src="images/zdjecie1.jpg" alt="Zdjęcie 1 — opis" loading="lazy">
        <figcaption class="caption">Opis zdjęcia 1 (opcjonalnie)</figcaption>
      </figure>

      <figure>
        <img src="images/zdjecie2.jpg" alt="Zdjęcie 2 — opis" loading="lazy">
        <figcaption class="caption">Opis zdjęcia 2 (opcjonalnie)</figcaption>
      </figure>

      <figure>
        <img src="images/zdjecie3.jpg" alt="Zdjęcie 3 — opis" loading="lazy">
        <figcaption class="caption">Opis zdjęcia 3 (opcjonalnie)</figcaption>
      </figure>

      <!-- Dodaj kolejne <figure> z innymi obrazami w tej samej strukturze -->
    </section>

    <!-- Kafelek pojawiający się na samym dole strony -->
    <a class="bottom-tile" href="https://example.com" target="_blank" rel="noopener">
      Kafelek z linkiem — kliknij tutaj
    </a>
  </main>
</body>
</html>
