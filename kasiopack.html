<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasiopack – Galeria</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #000;
      color: white;
      font-family: system-ui, sans-serif;
      text-align: center;
    }

    h1 {
      margin-bottom: 30px;
      font-size: 36px;
    }

    .gallery {
      display: flex;
      flex-direction: column;
      gap: 18px;
      align-items: center;
      max-width: 900px;
      margin: auto;
    }

    .gallery img {
      width: 100%;
      max-width: 820px;
      border-radius: 10px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.6);
    }

    .bottom-tile {
      margin: 50px auto 0 auto;
      display: inline-block;
      padding: 16px 28px;
      background: white;
      color: black;
      border-radius: 12px;
      font-size: 18px;
      text-decoration: none;
      font-weight: bold;
      box-shadow: 0 6px 18px rgba(0,0,0,0.4);
      transition: transform .12s ease;
    }

    .bottom-tile:hover {
      transform: translateY(-4px);
    }
  </style>
</head>
<body>

  <h1>Kasiopack – Galeria</h1>

  <div class="gallery">
    <img src="images/img1.jpg">
    <img src="images/img2.jpg">
    <img src="images/img3.jpg">
    <img src="images/img4.jpg">
    <img src="images/img5.jpg">
  </div>

  <a class="bottom-tile" href="https://example.com" target="_blank">
    Kafelek z linkiem
  </a>

</body>
</html>
