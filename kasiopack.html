<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasiopack – Galeria</title>

  <style>
    body {
      margin: 0;
      padding: 20px;
      background: #000;
      color: white;
      font-family: system-ui, sans-serif;
      text-align: center;
    }

    h1 {
      margin-bottom: 30px;
      font-size: 36px;
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
      max-width: 1000px;
      margin: auto;
    }

    .gallery img {
      width: 250px;
      height: 180px;
      object-fit: cover;
      border-radius: 10px;
      transition: transform 0.2s;
    }

    .gallery img:hover {
      transform: scale(1.05);
    }

    .bottom-tile {
      margin: 50px auto 0 auto;
      display: inline-block;
      padding: 16px 28px;
      background: white;
      color: black;
      border-radius: 12px;
      font-size: 18px;
      text-decoration: none;
      font-weight: bold;
      transition: transform 0.2s;
    }

    .bottom-tile:hover {
      transform: translateY(-4px);
    }
  </style>
</head>
<body>

  <h1>Kasiopack – Galeria</h1>

  <!-- Wrzucasz zdjęcia do folderu /images/ -->
  <div class="gallery">
    <img src="images/zdjecie1.jpg" alt="zdjęcie1">
    <img src="images/zdjecie2.jpg" alt="zdjęcie2">
    <img src="images/zdjecie3.jpg" alt="zdjęcie3">
    <img src="images/zdjecie4.jpg" alt="zdjęcie4">
  </div>

  <!-- Kafelek na dole -->
  <a class="bottom-tile" href="https://example.com" target="_blank">
    Kliknij tutaj – Link
  </a>

</body>
</html>
