<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Najlepsze Txt Polska</title>

  <style>
    body {
      background: #000;
      margin: 0;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-family: system-ui, sans-serif;
    }

    .card {
      text-align: center;
    }

    .links {
      display: flex;
      gap: 12px;
      justify-content: center;
      margin-top: 20px;
    }

    .links a {
      display: inline-block;
      padding: 10px 18px;
      min-width: 160px;
      text-decoration: none;
      color: #000;
      background: #fff;
      border-radius: 10px;
      font-weight: 600;
      transition: transform .12s ease;
    }

    .links a:hover {
      transform: translateY(-4px);
    }

    .links a.disabled {
      opacity: 0.6;
      pointer-events: none;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>Najlepsze Txt Polska</h1>

    <div class="links">
      <a href="kasiopack.html">Kasiopack</a>
      <a class="disabled">Wkrótce</a>
      <a class="disabled">Wkrótce</a>
    </div>
  </div>

</body>
</html>
