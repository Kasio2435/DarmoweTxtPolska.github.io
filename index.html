<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Najlepsze Txt Polska</title>

  <!-- favicon 8x8 -->
  <link id="favicon" rel="icon" type="image/png" href="favicon-8x8.png">

  <script>
    const img = new Image();
    img.src = 'favicon-8x8.png';
    img.onload = () => {
      const canvas = document.createElement('canvas');
      canvas.width = 32;
      canvas.height = 32;
      const ctx = canvas.getContext('2d');
      ctx.imageSmoothingEnabled = true;
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(img, 0, 0, 32, 32);
      const favicon = document.getElementById('favicon');
      favicon.href = canvas.toDataURL('image/png');
    };
  </script>

  <style>
    :root{
      --bg:#000;
      --text:#fff;
      --muted:rgba(255,255,255,0.6);
    }

    html,body{
      height:100%;
      margin:0;
    }

    body{
      background:var(--bg);
      color:var(--text);
      font-family:system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial,"Noto Sans",sans-serif;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:24px;
    }

    .card{
      text-align:center;
      max-width:720px;
      width:100%;
    }

    h1{
      font-size:clamp(28px,6vw,56px);
      margin:0 0 18px 0;
      font-weight:700;
    }

    /* czerwony napis */
    .discord-info{
      color:#ff2727;
      font-size:22px;
      font-weight:800;
      margin-bottom:16px;
      text-shadow:0 0 10px rgba(255,0,0,0.8);
    }

    .links{
      display:flex;
      gap:12px;
      justify-content:center;
      flex-wrap:wrap;
      margin-top:12px;
    }

    .links a{
      display:inline-block;
      padding:10px 18px;
      min-width:160px;
      text-decoration:none;
      color:#000;
      background:#fff;
      border-radius:10px;
      font-weight:600;
      transition:transform .12s ease,opacity .12s ease;
    }

    .links a:hover{
      transform:translateY(-4px);
    }

    .links a.disabled{
      pointer-events:none;
      opacity:0.6;
    }

    .small{
      margin-top:14px;
      color:var(--muted);
      font-size:14px;
    }

    @media (max-width:420px){
      .links a{
        min-width:140px;
        padding:10px 12px;
      }
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Najlepsze Txt Polska</h1>

    <!-- TU WKLEJONY NAPIS -->
    <div class="discord-info">Mój Discord: zmywarkaihuj</div>

    <nav class="links" aria-label="Główne linki">
      <a href="kasiopack.html" id="kasiopack">Kasiopack</a>
      <a href="#" class="disabled" aria-disabled="true">Wkrótce dostępne</a>
      <a href="#" class="disabled" aria-disabled="true">Wkrótce dostępne</a>
    </nav>

    <div class="small">By: Kasio2435</div>
  </div>
</body>
</html>
